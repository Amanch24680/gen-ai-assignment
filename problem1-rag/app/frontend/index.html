<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost-Efficient RAG Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app-container" class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="header-icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg>
                </div>
                <h1 class="app-title">Cost-Efficient RAG Assistant</h1>
            </div>
            <div id="status-indicator" class="status-badge" aria-live="polite">
                <span class="status-dot"></span>
                <span id="status-text" class="status-text">Ready</span>
            </div>
        </header>

        <!-- Main Chat Area -->
        <main class="chat-viewport">
            <div id="chat-messages" class="chat-messages" role="log" aria-live="polite">
                <!-- Initial Empty State -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon" aria-hidden="true">💬</div>
                    <h2 class="empty-title">Welcome to RAG Assistant</h2>
                    <p class="empty-subtitle">Ask questions grounded on ingested technical documents. All responses include verified source citations and execution latency.</p>
                    <div class="sample-queries">
                        <span class="sample-label">Try asking:</span>
                        <button type="button" class="sample-chip" data-query="What is the architecture of the RAG application?">What is the architecture of the RAG application?</button>
                        <button type="button" class="sample-chip" data-query="Explain how text chunking and vector storage work.">Explain how text chunking and vector storage work.</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Global Error Container -->
        <div id="error-container" class="error-container" role="alert" style="display: none;">
            <div class="error-content">
                <svg class="error-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="error-message" class="error-message"></span>
            </div>
            <button id="error-close-btn" class="error-close-btn" aria-label="Close error message">&times;</button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading-indicator" aria-live="assertive" style="display: none;">
            <div class="spinner-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <span class="loading-text">Searching documents & generating grounded response...</span>
        </div>

        <!-- Input Area -->
        <footer class="input-container">
            <form id="chat-form" class="chat-form">
                <div class="input-wrapper">
                    <textarea 
                        id="query-input" 
                        class="query-input" 
                        placeholder="Ask a question about your documents (Press Enter to send, Shift+Enter for new line)..." 
                        rows="2" 
                        required
                        aria-label="User question input"
                    ></textarea>
                </div>
                <button type="submit" id="send-button" class="send-button" aria-label="Send query">
                    <span>Send</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
